name: Release

# Publishes every package to npm when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# Uses npm trusted publishing (OIDC): no token is stored anywhere (see docs/publishing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance: links each published version to this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url: with it, setup-node writes an .npmrc that points to a placeholder
      # NODE_AUTH_TOKEN, and npm tries that token instead of trusted publishing (OIDC) → E404.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - run: npm install -g npm@latest
      - name: Check the publishing setup (no secrets printed)
        run: |
          echo "npm $(npm --version)"
          if [ -n "${NODE_AUTH_TOKEN+x}" ]; then echo "::error::NODE_AUTH_TOKEN is set; it would override trusted publishing"; exit 1; fi
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "::error::No OIDC token available (permissions: id-token: write)"; exit 1; fi
          echo "Trusted publishing ready"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run licenses
      - name: Check that the tag matches the package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for p in core office recipes cli mcp; do
            V=$(node -p "require('./packages/$p/package.json').version")
            [ "$V" = "$TAG" ] || { echo "packages/$p is $V, tag is $TAG"; exit 1; }
          done
      - name: Check that every package publishes as public
        run: |
          for p in core office recipes cli mcp; do
            A=$(node -p "require('./packages/$p/package.json').publishConfig?.access")
            [ "$A" = "public" ] || { echo "packages/$p lacks publishConfig.access=public"; exit 1; }
          done
      # Order matters: dependencies first.
      - run: |
          for p in core office recipes cli mcp; do
            NAME=$(node -p "require('./packages/$p/package.json').name")
            VER=$(node -p "require('./packages/$p/package.json').version")
            # Re-running after a partial failure must not stop on versions already out.
            if npm view "$NAME@$VER" version >/dev/null 2>&1; then
              echo "$NAME@$VER is already on npm, skipping"
              continue
            fi
            npm publish --workspace packages/$p --provenance
          done
